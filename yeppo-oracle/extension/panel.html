<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>yeppo</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="panel">
    <header class="bar">
      <i class="mark"></i>
      <b>yeppo</b>
      <span class="grow"></span>
      <span id="where" class="dim"></span>
    </header>
    <iframe id="view" allow="clipboard-write"></iframe>
    <form id="labform" class="labform" hidden>
      <input id="labkey" placeholder="Lab key" spellcheck="false" />
      <input id="labpaper" placeholder="Paper wallet id" spellcheck="false" />
      <button>Save</button>
    </form>
    <footer class="foot">
      <label><input type="checkbox" id="badge" /> Badge on pages</label>
      <span><a id="lab" href="#" title="Owner only">lab</a> · <a href="https://yeppo.it" target="_blank" rel="noreferrer">yeppo.it ↗</a></span>
    </footer>
    <script src="panel.js"></script>
  </body>
</html>
