<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>yeppo oracle</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="panel">
    <header class="bar">
      <img src="icons/32.png" width="20" height="20" alt="" />
      <b>yeppo</b><span class="tag">ORACLE</span>
      <span class="grow"></span>
      <span id="where" class="dim"></span>
    </header>
    <iframe id="view" allow="clipboard-write" hidden></iframe>
    <main id="empty" hidden>
      <div class="eye"></div>
      <h1>Open a coin and yeppo reads it</h1>
      <p>Go to any coin on one of these sites. yeppo spots it by itself and tells you, in plain words, what usually happens next.</p>
      <div class="sites">
        <span>pump.fun</span><span>GMGN</span><span>Axiom</span><span>Photon</span><span>BullX</span><span>DexScreener</span><span>Birdeye</span><span>Jupiter</span>
      </div>
      <form id="paste">
        <input id="ca" placeholder="…or paste a coin address (CA)" autocomplete="off" spellcheck="false" />
        <button>Read</button>
      </form>
      <p id="err" class="err" hidden>That is not a coin address.</p>
    </main>
    <footer class="foot">
      <label><input type="checkbox" id="badge" /> Show the yeppo badge on trading sites</label>
      <a href="https://yeppo.it" target="_blank" rel="noreferrer">yeppo.it ↗</a>
    </footer>
    <script src="panel.js"></script>
  </body>
</html>
