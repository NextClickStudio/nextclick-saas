            <h2 class="method__title display" data-h>Dal sopralluogo <em>all’esperienza.</em></h2>
            <p data-h>Un’osservazione esterna, attenta e competente permette di vedere dettagli e potenzialità che chi vive ogni giorno la struttura spesso non percepisce: incoerenze da risolvere, punti di forza da valorizzare, elementi emotivi che meritano spazio.</p>
            <p data-h>Tre fasi, un solo filo conduttore: l’identità del luogo.</p>

            <h3 class="method__step display" data-h>Osservare la storia</h3>
            <p data-h>Un sopralluogo immersivo: entriamo nella struttura, studiamo gli spazi, ascoltiamo la storia e raccogliamo suggestioni e dettagli tecnici. Queste informazioni vengono poi lette in chiave progettuale: il carattere, i valori e il potenziale del luogo diventano visione e direzione del progetto.</p>
            <div class="method__deliverable" data-h>
              <span class="eyebrow">The Identity Walkthrough</span>
              <p>Le tre fondatrici conducono un’esperienza strutturata: durante la visita vengono raccolte immagini, impressioni sensoriali, suggestioni narrative e dettagli tecnici. <strong>È un momento immersivo, empatico, quasi un rituale creativo.</strong></p>
